name: build-final-card

on:
  push:
    paths:
      - '.github/final-card-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media QA dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Rebuild hormone ledger module
        run: python3 modules/hormone-ledger/build.py

      - name: Module unit QA
        run: npm test --prefix modules/hormone-ledger

      - name: Media QA
        run: python3 modules/hormone-ledger/qa/media.py

      - name: Assemble final card JSON
        run: python3 scripts/build_final_card.py

      - name: Package importable Candidate2 PNG without changing cover
        run: python3 scripts/package_candidate_png.py

      - name: Inspect actual Candidate2 JSON and PNG integration
        run: python3 modules/hormone-ledger/qa/candidate2-integration.py

      - name: Upload Candidate2 JSON, PNG and QA
        uses: actions/upload-artifact@v4
        with:
          name: fire-kunoichi-candidate2
          if-no-files-found: error
          path: |
            release/火影姬世界_Candidate2_v1.0.json
            release/火影姬世界_Candidate2_v1.0.png
            release/火影姬世界_Candidate2_v1.0_QA.json
            release/火影姬世界_Candidate2_v1.0_PNG_QA.json
