变量更新规则:
  角色荷尔蒙:
    check:
      - 只由 hormone-ledger 将当前正常 assistant 原始 hormone 完整快照机械同步至同名 Record。
      - 已遇见者按正式规则在 hormone 中写最终整数值，范围0至100；未遇见者不建键。
  角色活体铠甲:
    check:
      - 只同步同一个 hormone 快照中的当前铠甲名，无铠甲写“无”。
  写入边界:
    - 禁止独立更新模型对这两个 Record 生成 JSONPatch、推算变化或另设事实源。
    - 漏块或非法块保留上一有效快照，并标记上游输出契约失败；不得由前端补算。
